#        environment:
#            - LOG_DIR=./log
#            - LOG_FILE=celery_fast2_22.log
#        depends_on:
#            - redis

#----------------------------------------------------------------------------------
    nginx:
        container_name: nginx_new
        build:
            context: .
            dockerfile: ./nginx/Docker-nginx
        networks:
            my_network:
                ipv4_address: 172.20.0.8
        ports:
            - "443:443"
        restart: always
        depends_on:
            - app_first
            - app_two

#----------------------------------------------------------------------------------
networks:
    my_network:
        name: app_net_new
        external: true

